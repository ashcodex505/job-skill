# Scheduled job board (jobscanner-style): every 12 hours, scrape the ATS APIs,
# regenerate JOBS.md + the README top-picks section, and commit the result.
# Uses a throwaway SQLite DB in the runner — your local data and credentials
# are never involved. board/jobs.json is committed so "first seen" dates and
# 🆕 badges survive between runs.
name: Job board

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5,17 * * *" # every 12h (05:23 / 17:23 UTC; offset avoids the top-of-hour rush)

permissions:
  contents: write
  issues: write
  actions: write # backstop: re-sync watch.yml enabled-state with the watchlist

concurrency:
  group: job-board
  cancel-in-progress: false

jobs:
  update-board:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Scrape and render board
        id: board
        run: npm run board
        env:
          DATABASE_PATH: /tmp/scrape.db
          BOARD_NEW_JOBS_FILE: ${{ runner.temp }}/new-jobs.md
          BOARD_URGENT_FILE: ${{ runner.temp }}/urgent.md
      - name: Commit board updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOBS.md README.md board/jobs.json
          if git diff --cached --quiet; then
            echo "No board changes."
          else
            git commit \
              -m "chore: refresh job board (${{ steps.board.outputs.summary }}) [skip ci]" \
              -m "Co-authored-by: Ashish Kurse <ashishkurse@gmail.com>"
            git pull --rebase origin main
            git push
          fi
      - name: Urgent watchlist alert
        if: steps.board.outputs.urgent_count != '' && steps.board.outputs.urgent_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          URGENT_FILE: ${{ runner.temp }}/urgent.md
        run: |
          [ -s "$URGENT_FILE" ] || exit 0
          gh label create urgent --color B60205 --description "Watchlist match — apply now" 2>/dev/null || true
          { echo "cc @${{ github.repository_owner }}"; echo; cat "$URGENT_FILE"; } > /tmp/urgent-body.md
          gh issue create \
            --title "🚨 URGENT: ${{ steps.board.outputs.urgent_title }}" \
            --label urgent \
            --body-file /tmp/urgent-body.md
      # Create a permanent issue for each cycle that finds new jobs. Historical
      # alerts are never edited or deleted, so the issue list is a run archive.
      - name: Create job-alert issue
        if: steps.board.outputs.new_count != '0' && steps.board.outputs.new_count != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_JOBS_FILE: ${{ runner.temp }}/new-jobs.md
        run: |
          [ -s "$NEW_JOBS_FILE" ] || { echo "No new-jobs file; skipping."; exit 0; }
          RUN_DISPLAY=$(date -u '+%Y-%m-%d %H:%M UTC')
          TITLE="🆕 ${{ steps.board.outputs.new_count }} new job matches — $RUN_DISPLAY"
          {
            echo "cc @${{ github.repository_owner }} — **${{ steps.board.outputs.new_count }} new roles** found on $RUN_DISPLAY — newest posting time first."
            echo
            cat "$NEW_JOBS_FILE"
            echo
            echo "_This issue is a permanent alert record. New workflow runs create new issues instead of replacing this one._"
          } > /tmp/job-alert.md
          gh label create job-alert --color 1D76DB --description "Automated new-job notifications" 2>/dev/null || true
          gh issue create --title "$TITLE" --label job-alert --body-file /tmp/job-alert.md
      # Backstop: keep watch.yml's enabled-state aligned with the watchlist
      # in case the app-side toggle ever failed.
      - name: Sync watch workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(sed -n '/^## Watches/,$p' career/watchlist.md 2>/dev/null | grep -c '^- ' || true)
          if [ "$n" -gt 0 ]; then
            gh workflow enable watch.yml -R ${{ github.repository }} 2>/dev/null || true
          else
            gh workflow disable watch.yml -R ${{ github.repository }} 2>/dev/null || true
          fi
          echo "watchlist bullets: $n — watch.yml $([ "$n" -gt 0 ] && echo enabled || echo disabled)"
