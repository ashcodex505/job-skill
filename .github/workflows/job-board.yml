# Scheduled job board (jobscanner-style): every 12 hours, scrape the ATS APIs,
# regenerate JOBS.md + the README top-picks section, and commit the result.
# Uses a throwaway SQLite DB in the runner — your local data and credentials
# are never involved. board/jobs.json is committed so "first seen" dates and
# 🆕 badges survive between runs.
name: Job board

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5,17 * * *" # every 12h (05:23 / 17:23 UTC; offset avoids the top-of-hour rush)

permissions:
  contents: write
  issues: write
  actions: write # backstop: re-sync watch.yml enabled-state with the watchlist

concurrency:
  group: job-board
  cancel-in-progress: false

jobs:
  update-board:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Scrape and render board
        id: board
        run: npm run board
        env:
          DATABASE_PATH: /tmp/scrape.db
          BOARD_NEW_JOBS_FILE: ${{ runner.temp }}/new-jobs.md
          BOARD_URGENT_FILE: ${{ runner.temp }}/urgent.md
          BOARD_BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
          BOARD_ALERT_PAYLOAD_FILE: ${{ runner.temp }}/alerts.json
      - name: Urgent watchlist alert
        if: steps.board.outputs.urgent_count != '' && steps.board.outputs.urgent_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          URGENT_FILE: ${{ runner.temp }}/urgent.md
          ALERT_PAYLOAD: ${{ runner.temp }}/alerts.json
          FINGERPRINT: ${{ steps.board.outputs.urgent_fingerprint }}
          NOTIFY_USER: ${{ vars.JOB_ALERT_GITHUB_USER || github.repository_owner }}
        run: |
          [ -s "$URGENT_FILE" ] || exit 0
          gh label create urgent --color B60205 --description "Watchlist match — apply now" 2>/dev/null || true
          issue=$(gh issue list --state all --limit 200 --json number,body --jq "[.[] | select(.body | contains(\"<!-- job-alert:$FINGERPRINT -->\"))][0].number // empty")
          if [ -z "$issue" ]; then
            { echo "cc @$NOTIFY_USER"; echo; cat "$URGENT_FILE"; } > /tmp/urgent-body.md
            url=$(gh issue create --title "🚨 URGENT: ${{ steps.board.outputs.urgent_title }}" --label urgent --assignee "$NOTIFY_USER" --body-file /tmp/urgent-body.md)
            gh issue view "$url" >/dev/null
          else
            gh issue view "$issue" >/dev/null
          fi
          npm run alert:ack -- --payload "$ALERT_PAYLOAD" --type urgent
      - name: Big-tech alert
        if: steps.board.outputs.bigtech_count != '' && steps.board.outputs.bigtech_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
          ALERT_PAYLOAD: ${{ runner.temp }}/alerts.json
          FINGERPRINT: ${{ steps.board.outputs.bigtech_fingerprint }}
          NOTIFY_USER: ${{ vars.JOB_ALERT_GITHUB_USER || github.repository_owner }}
        run: |
          [ -s "$BIGTECH_FILE" ] || exit 0
          gh label create big-tech --color 0E8A16 --description "New big-tech/unicorn intern or new-grad role" 2>/dev/null || true
          issue=$(gh issue list --state all --limit 200 --json number,body --jq "[.[] | select(.body | contains(\"<!-- job-alert:$FINGERPRINT -->\"))][0].number // empty")
          if [ -z "$issue" ]; then
            { echo "cc @$NOTIFY_USER — new big-tech/unicorn early-career roles (quant/banking excluded)."; echo; cat "$BIGTECH_FILE"; } > /tmp/bigtech-body.md
            url=$(gh issue create --title "⭐ Big tech: ${{ steps.board.outputs.bigtech_title }}" --label big-tech --assignee "$NOTIFY_USER" --body-file /tmp/bigtech-body.md)
            gh issue view "$url" >/dev/null
          else
            gh issue view "$issue" >/dev/null
          fi
          npm run alert:ack -- --payload "$ALERT_PAYLOAD" --type bigtech
      - name: Commit board updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOBS.md README.md board/
          if git diff --cached --quiet; then
            echo "No board changes."
          else
            git commit \
              -m "chore: refresh job board (${{ steps.board.outputs.summary }}) [skip ci]" \
              -m "Co-authored-by: Ashish Kurse <ashishkurse@gmail.com>"
            if ! git pull --rebase origin main; then
              echo "Push race detected — dropping this run's board commit; it self-corrects next run."
              git rebase --abort
            else
              git push
            fi
          fi
      # No per-cycle job-alert issues: the only notifications are ⭐ big-tech
      # and 🚨 urgent watchlist matches. New jobs still land on the board and
      # in the run's step summary.
      # Backstop: watch.yml must always be enabled — it powers the big-tech
      # alerts even when the watchlist is empty.
      - name: Ensure watch workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable watch.yml -R ${{ github.repository }} 2>/dev/null || true
