# Unified scheduled watcher: scans watchlisted, priority, and approved companies
# through their direct adapters, then checks the configured community feeds in
# the same process. One job means one checkout, one Node setup, one dependency
# install, and one per-job billing round-up per tick.
#
# The schedule is month-length-aware: an hourly :07 base plus enough :37 runs
# to total 43/day in 31-day months, 45/day in 30-day months, and 48/day in
# February. At the measured ~2 billable minutes per consolidated run, this
# leaves room under the 3,000-minute GitHub Pro allowance for the 12-hour board,
# weekly discovery, monthly registry check, push-triggered runs, and variance.
#
# career/preferences.md is edited by hand, not through a dashboard form. Every
# local watch-scan tick (POST /api/scrape/watch, while the dashboard is open)
# checks it for uncommitted changes and pushes them automatically; changes to
# any of the three career files below also trigger an immediate CI scan.
#
# Notifications remain sparse: a big-tech issue only for new, recent eligible
# roles and an urgent issue for personal watchlist matches. The committed alert
# ledger in board/alerted.json prevents duplicate notifications.
name: Feed watch

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *" # hourly base: 24 runs/day
    - cron: "37 0-1,3-6,8-11,13-16,18-21,23 * 1,3,5,7,8,10,12 *" # 31-day months: +19 = 43/day
    - cron: "37 0-3,5-11,13-19,21-23 * 4,6,9,11 *" # 30-day months: +21 = 45/day
    - cron: "37 * * 2 *" # February: +24 = 48/day
  push:
    branches: [main]
    paths: ["career/watchlist.md", "career/priority-companies.md", "career/preferences.md"]

permissions:
  contents: write
  issues: write

concurrency:
  group: job-board
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run may start after another board workflow has committed.
          # Always begin from current main so committed scraper state is fresh.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Watch scrape
        id: board
        run: npm run board -- --watch
        env:
          DATABASE_PATH: /tmp/scrape.db
          BOARD_URGENT_FILE: ${{ runner.temp }}/urgent.md
          BOARD_BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
          BOARD_SOURCE_HEALTH_FILE: ${{ runner.temp }}/source-health.md
          BOARD_POLICY_GAP_FILE: ${{ runner.temp }}/policy-gap.md
          BOARD_RECOVERY_FILE: ${{ runner.temp }}/recovery.md
          BOARD_ALERT_PAYLOAD_FILE: ${{ runner.temp }}/alerts.json
      - name: Report scraper source health
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_FILE: ${{ runner.temp }}/source-health.md
          ERROR_COUNT: ${{ steps.board.outputs.source_error_count }}
          NOTIFY_USER: ${{ vars.JOB_ALERT_GITHUB_USER || github.repository_owner }}
        run: |
          gh label create scraper-health --color D93F0B --description "A configured job source could not be checked" 2>/dev/null || true
          issue=$(gh issue list --state open --label scraper-health --json number --jq '.[0].number // empty')
          if [ "${ERROR_COUNT:-0}" != "0" ]; then
            [ -s "$HEALTH_FILE" ] || exit 0
            { echo "cc @$NOTIFY_USER"; echo; cat "$HEALTH_FILE"; } > /tmp/source-health-body.md
            if [ -z "$issue" ]; then
              gh issue create --title "🛠 Job scraper source failure" --label scraper-health --assignee "$NOTIFY_USER" --body-file /tmp/source-health-body.md
            else
              gh issue edit "$issue" --body-file /tmp/source-health-body.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "All configured direct job sources recovered on this run."
          fi
      - name: Report strict-policy gaps
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_FILE: ${{ runner.temp }}/policy-gap.md
          GAP_COUNT: ${{ steps.board.outputs.policy_gap_count }}
          NOTIFY_USER: ${{ vars.JOB_ALERT_GITHUB_USER || github.repository_owner }}
        run: |
          gh label create policy-gap --color FBCA04 --description "A likely early-career title conflicts with strict preferences" 2>/dev/null || true
          issue=$(gh issue list --state open --label policy-gap --json number --jq '.[0].number // empty')
          if [ "${GAP_COUNT:-0}" != "0" ]; then
            [ -s "$POLICY_FILE" ] || exit 0
            { echo "cc @$NOTIFY_USER"; echo; cat "$POLICY_FILE"; } > /tmp/policy-gap-body.md
            if [ -z "$issue" ]; then
              gh issue create --title "⚠️ Job title policy needs review" --label policy-gap --assignee "$NOTIFY_USER" --body-file /tmp/policy-gap-body.md
            else
              gh issue edit "$issue" --body-file /tmp/policy-gap-body.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "No strict new-grad title-policy gaps were found on this run."
          fi
      - name: Record watcher recovery in run summary
        if: steps.board.outputs.recovery_gap_minutes != '' && steps.board.outputs.recovery_gap_minutes != '0'
        env:
          RECOVERY_FILE: ${{ runner.temp }}/recovery.md
        run: |
          [ -s "$RECOVERY_FILE" ] || exit 0
          { echo "## Watcher recovery"; echo; cat "$RECOVERY_FILE"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Urgent watchlist alert
        if: steps.board.outputs.urgent_count != '' && steps.board.outputs.urgent_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          URGENT_FILE: ${{ runner.temp }}/urgent.md
          ALERT_PAYLOAD: ${{ runner.temp }}/alerts.json
          FINGERPRINT: ${{ steps.board.outputs.urgent_fingerprint }}
          NOTIFY_USER: ${{ vars.JOB_ALERT_GITHUB_USER || github.repository_owner }}
        run: |
          [ -s "$URGENT_FILE" ] || exit 0
          gh label create urgent --color B60205 --description "Watchlist match — apply now" 2>/dev/null || true
          issue=$(gh issue list --state all --limit 200 --json number,body --jq "[.[] | select(.body | contains(\"<!-- job-alert:$FINGERPRINT -->\"))][0].number // empty")
          if [ -z "$issue" ]; then
            { echo "cc @$NOTIFY_USER"; echo; cat "$URGENT_FILE"; } > /tmp/urgent-body.md
            url=$(gh issue create --title "🚨 URGENT: ${{ steps.board.outputs.urgent_title }}" --label urgent --assignee "$NOTIFY_USER" --body-file /tmp/urgent-body.md)
            gh issue view "$url" >/dev/null
          else
            gh issue view "$issue" >/dev/null
          fi
          npm run alert:ack -- --payload "$ALERT_PAYLOAD" --type urgent
      - name: Big-tech alert
        if: steps.board.outputs.bigtech_count != '' && steps.board.outputs.bigtech_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
          ALERT_PAYLOAD: ${{ runner.temp }}/alerts.json
          FINGERPRINT: ${{ steps.board.outputs.bigtech_fingerprint }}
          NOTIFY_USER: ${{ vars.JOB_ALERT_GITHUB_USER || github.repository_owner }}
        run: |
          [ -s "$BIGTECH_FILE" ] || exit 0
          gh label create big-tech --color 0E8A16 --description "New big-tech/unicorn intern or new-grad role" 2>/dev/null || true
          issue=$(gh issue list --state all --limit 200 --json number,body --jq "[.[] | select(.body | contains(\"<!-- job-alert:$FINGERPRINT -->\"))][0].number // empty")
          if [ -z "$issue" ]; then
            { echo "cc @$NOTIFY_USER — new big-tech/FAANG/unicorn early-career roles (quant/banking excluded)."; echo; cat "$BIGTECH_FILE"; } > /tmp/bigtech-body.md
            url=$(gh issue create --title "⭐ Big tech: ${{ steps.board.outputs.bigtech_title }}" --label big-tech --assignee "$NOTIFY_USER" --body-file /tmp/bigtech-body.md)
            gh issue view "$url" >/dev/null
          else
            gh issue view "$issue" >/dev/null
          fi
          npm run alert:ack -- --payload "$ALERT_PAYLOAD" --type bigtech
      - name: Commit board updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOBS.md README.md board/
          if git diff --cached --quiet; then
            echo "No board changes."
          else
            git commit -m "chore: feed watch (${{ steps.board.outputs.summary }}) [skip ci]"
            if ! git pull --rebase origin main; then
              echo "Push race detected — dropping this run's board commit; it self-corrects next run."
              git rebase --abort
            else
              git push
            fi
          fi
