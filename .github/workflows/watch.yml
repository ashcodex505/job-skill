# Hourly scan: scrapes watchlisted supported companies plus the community
# feeds (SimplifyJobs + speedyapply — which cover anti-bot portals like
# Google/Amazon), merges into the committed board, and raises:
#   - an URGENT issue for new watchlist matches
#   - a ⭐ big-tech issue for new big-tech/unicorn intern & new-grad roles
#     (quant firms and banks excluded — see src/scraper/big-tech-alert.ts)
# Runs even with an empty watchlist so big-tech alerts always fire.
name: Watchlist

on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *" # hourly (best-effort; GitHub cron can lag)
  push:
    branches: [main]
    paths: ["career/watchlist.md"] # adding a watch in the app triggers an immediate run

permissions:
  contents: write
  issues: write

concurrency:
  group: job-board # shares the group with the full run so they never race
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Watch scrape
        id: board
        run: npm run board -- --watch
        env:
          DATABASE_PATH: /tmp/scrape.db
          BOARD_NEW_JOBS_FILE: ${{ runner.temp }}/new-jobs.md
          BOARD_URGENT_FILE: ${{ runner.temp }}/urgent.md
          BOARD_BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
      - name: Commit board updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOBS.md README.md board/jobs.json
          if git diff --cached --quiet; then
            echo "No board changes."
          else
            git commit \
              -m "chore: watchlist scan (${{ steps.board.outputs.summary }}) [skip ci]" \
              -m "Co-authored-by: Ashish Kurse <ashishkurse@gmail.com>"
            git pull --rebase origin main
            git push
          fi
      - name: Urgent watchlist alert
        if: steps.board.outputs.urgent_count != '' && steps.board.outputs.urgent_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          URGENT_FILE: ${{ runner.temp }}/urgent.md
        run: |
          [ -s "$URGENT_FILE" ] || exit 0
          gh label create urgent --color B60205 --description "Watchlist match — apply now" 2>/dev/null || true
          { echo "cc @${{ github.repository_owner }}"; echo; cat "$URGENT_FILE"; } > /tmp/urgent-body.md
          gh issue create \
            --title "🚨 URGENT: ${{ steps.board.outputs.urgent_title }}" \
            --label urgent \
            --body-file /tmp/urgent-body.md
      - name: Big-tech alert
        if: steps.board.outputs.bigtech_count != '' && steps.board.outputs.bigtech_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
        run: |
          [ -s "$BIGTECH_FILE" ] || exit 0
          gh label create big-tech --color 0E8A16 --description "New big-tech/unicorn intern or new-grad role" 2>/dev/null || true
          { echo "cc @${{ github.repository_owner }} — new big-tech/unicorn early-career roles (quant/banking excluded)."; echo; cat "$BIGTECH_FILE"; } > /tmp/bigtech-body.md
          gh issue create \
            --title "⭐ Big tech: ${{ steps.board.outputs.bigtech_title }}" \
            --label big-tech \
            --body-file /tmp/bigtech-body.md
