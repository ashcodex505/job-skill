# Feed watcher: fires the community-feed scrape ONLY when one of the watched
# job repos (SimplifyJobs/New-Grad-Positions, SimplifyJobs/Summer2026-
# Internships, SimplifyJobs/Summer2027-Internships, speedyapply/2027-SWE-
# College-Jobs, vanshb03/Summer2027-Internships, vanshb03/New-Grad-2027)
# receives a new commit.
# GitHub cannot trigger cross-repo, so an hourly poll compares their HEAD
# SHAs against board/feed-heads.json and exits in seconds when nothing
# changed.
#
# Separately, the `priority` job checks companies from TWO lists — Amazon
# plus career/priority-companies.md (app-managed, the dashboard's Priority
# companies panel) plus every company on career/preferences.md's own
# "Summer 2027 approved companies" list that has a real adapter (~70 as of
# this writing) — every 30 minutes, direct API calls with no upstream repo
# to gate on. There is no push notification from any of these companies
# ("tell us when a job opens") — polling on a schedule is the only way to
# know, the same as every other source in this project. What IS gated: if
# BOTH lists are empty, this job doesn't run at all — no CI minutes spent,
# nothing — but in practice the approved-companies list alone almost always
# keeps it non-empty. See board/watch-scan-settings.json (committed by the
# dashboard) for the on/off toggle and interval this job also respects.
#
# career/preferences.md is edited by hand, not through a dashboard form —
# every local watch-scan tick (POST /api/scrape/watch, while the dashboard
# is open) checks it for uncommitted changes and pushes them automatically,
# which is also what gets a hand-edit here within one tick interval.
#
# Notifications are intentionally sparse either way: a ⭐ big-tech issue only
# when new big-tech/FAANG/unicorn intern or new-grad roles appear, posted
# within the last week (quant/banks excluded, stale postings excluded even
# if newly discovered — src/scraper/big-tech-alert.ts), plus the 🚨 urgent
# issue for personal watchlist matches. The committed alert ledger
# (board/alerted.json) guarantees no posting is ever notified twice. No
# per-run noise.
name: Feed watch

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *" # poll twice hourly; real work only on upstream commits
  push:
    branches: [main]
    paths: ["career/watchlist.md", "career/priority-companies.md", "career/preferences.md"]

permissions:
  contents: write
  issues: write

concurrency:
  group: job-board
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      heads: ${{ steps.check.outputs.heads }}
      has_priority: ${{ steps.priority.outputs.has_priority }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            board
            career
      - name: Check priority-companies + approved-companies lists
        id: priority
        run: |
          n1=$(sed -n '/^## Priority/,$p' career/priority-companies.md 2>/dev/null | grep -c '^- ' || true)
          n2=$(sed -n '/^## Summer 2027 approved companies/,/^## /p' career/preferences.md 2>/dev/null | grep -c '^- ' || true)
          echo "Priority companies: $n1, approved companies: $n2"
          echo "has_priority=$([ "$n1" -gt 0 ] || [ "$n2" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Compare upstream feed HEADs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPOS="SimplifyJobs/New-Grad-Positions SimplifyJobs/Summer2026-Internships SimplifyJobs/Summer2027-Internships speedyapply/2027-SWE-College-Jobs vanshb03/Summer2027-Internships vanshb03/New-Grad-2027"
          HEADS="{"
          for repo in $REPOS; do
            sha=$(gh api "repos/$repo/commits?per_page=1" --jq '.[0].sha' 2>/dev/null) || sha=""
            # A repo that doesn't exist yet (next season's) records a stable
            # placeholder instead of an error body.
            echo "$sha" | grep -qE '^[0-9a-f]{40}$' || sha="unavailable"
            HEADS="$HEADS\"$repo\":\"$sha\","
          done
          HEADS="${HEADS%,}}"
          echo "heads=$HEADS" >> "$GITHUB_OUTPUT"
          PREV=$(cat board/feed-heads.json 2>/dev/null || echo "{}")
          if [ "$HEADS" = "$PREV" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream commits since last check — skipping scrape."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changed (or manual/push run) — scraping."
          fi

  watch:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Watch scrape
        id: board
        run: npm run board -- --watch
        env:
          DATABASE_PATH: /tmp/scrape.db
          BOARD_URGENT_FILE: ${{ runner.temp }}/urgent.md
          BOARD_BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
      - name: Record upstream feed HEADs
        run: printf '%s' '${{ needs.gate.outputs.heads }}' > board/feed-heads.json
      - name: Commit board updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOBS.md README.md board/
          if git diff --cached --quiet; then
            echo "No board changes."
          else
            git commit \
              -m "chore: feed watch (${{ steps.board.outputs.summary }}) [skip ci]"
            if ! git pull --rebase origin main; then
              # Regenerable board state; a genuine content conflict (concurrent
              # run/manual push) is safe to drop — the next scheduled run
              # regenerates it from source rather than needing manual resolution.
              echo "Push race detected — dropping this run's board commit; it self-corrects next run."
              git rebase --abort
            else
              git push
            fi
          fi
      - name: Urgent watchlist alert
        if: steps.board.outputs.urgent_count != '' && steps.board.outputs.urgent_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          URGENT_FILE: ${{ runner.temp }}/urgent.md
        run: |
          [ -s "$URGENT_FILE" ] || exit 0
          gh label create urgent --color B60205 --description "Watchlist match — apply now" 2>/dev/null || true
          { echo "cc @${{ github.repository_owner }}"; echo; cat "$URGENT_FILE"; } > /tmp/urgent-body.md
          gh issue create \
            --title "🚨 URGENT: ${{ steps.board.outputs.urgent_title }}" \
            --label urgent \
            --body-file /tmp/urgent-body.md
      - name: Big-tech alert
        if: steps.board.outputs.bigtech_count != '' && steps.board.outputs.bigtech_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
        run: |
          [ -s "$BIGTECH_FILE" ] || exit 0
          gh label create big-tech --color 0E8A16 --description "New big-tech/unicorn intern or new-grad role" 2>/dev/null || true
          { echo "cc @${{ github.repository_owner }} — new big-tech/FAANG/unicorn early-career roles (quant/banking excluded)."; echo; cat "$BIGTECH_FILE"; } > /tmp/bigtech-body.md
          gh issue create \
            --title "⭐ Big tech: ${{ steps.board.outputs.bigtech_title }}" \
            --label big-tech \
            --body-file /tmp/bigtech-body.md

  # No upstream repo to compare a commit SHA against, so this just runs
  # every scheduled tick (subject to the settings check below). Scoped to
  # Amazon + career/priority-companies.md + career/preferences.md's
  # approved-companies list (see board-cli.ts --priority) — direct API
  # calls per company, not a full sweep — sequenced after `watch` (not
  # parallel) so the two jobs never race pushing to board/.
  priority:
    needs: [gate, watch]
    if: always() && needs.gate.outputs.has_priority == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Cron still fires every 30 min regardless (schedules are static
      # YAML, not runtime-configurable) — this just decides whether that
      # tick does real work or a near-free no-op, based on the dashboard's
      # own on/off toggle and CI interval (board/watch-scan-settings.json,
      # committed by POST /api/scrape/watch's PUT handler). A skipped tick
      # costs a few seconds of an Actions runner, not a scrape.
      - name: Check watch-scan settings (enabled + CI interval)
        id: settings
        run: |
          node -e '
            const fs = require("fs");
            let s = {};
            try { s = JSON.parse(fs.readFileSync("board/watch-scan-settings.json", "utf8")); } catch {}
            const enabled = s.enabled !== false;
            const intervalMin = Number.isFinite(s.ciIntervalMinutes) && s.ciIntervalMinutes > 0 ? s.ciIntervalMinutes : 30;
            const lastRun = typeof s.lastCiRunAt === "string" ? s.lastCiRunAt : "";
            let dueNow = true;
            if (lastRun) {
              const elapsedMin = (Date.now() - new Date(lastRun).getTime()) / 60000;
              dueNow = elapsedMin >= intervalMin;
            }
            console.log(`run=${enabled && dueNow}`);
          ' >> "$GITHUB_OUTPUT"
      - run: npm ci
        if: steps.settings.outputs.run == 'true'
      - name: Priority company scrape
        id: board
        if: steps.settings.outputs.run == 'true'
        run: npm run board -- --priority --no-linkcheck
        env:
          DATABASE_PATH: /tmp/scrape.db
          BOARD_URGENT_FILE: ${{ runner.temp }}/urgent.md
          BOARD_BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
      - name: Commit board updates
        if: steps.settings.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node -e '
            const fs = require("fs");
            let s = {};
            try { s = JSON.parse(fs.readFileSync("board/watch-scan-settings.json", "utf8")); } catch {}
            s.lastCiRunAt = new Date().toISOString();
            fs.writeFileSync("board/watch-scan-settings.json", JSON.stringify(s, null, 1) + "\n");
          '
          git add JOBS.md README.md board/
          if git diff --cached --quiet; then
            echo "No board changes."
          else
            git commit \
              -m "chore: priority scan (${{ steps.board.outputs.summary }}) [skip ci]"
            if ! git pull --rebase origin main; then
              # Regenerable board state; a genuine content conflict (concurrent
              # run/manual push) is safe to drop — the next scheduled run
              # regenerates it from source rather than needing manual resolution.
              echo "Push race detected — dropping this run's board commit; it self-corrects next run."
              git rebase --abort
            else
              git push
            fi
          fi
      - name: Urgent watchlist alert
        if: steps.settings.outputs.run == 'true' && steps.board.outputs.urgent_count != '' && steps.board.outputs.urgent_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          URGENT_FILE: ${{ runner.temp }}/urgent.md
        run: |
          [ -s "$URGENT_FILE" ] || exit 0
          gh label create urgent --color B60205 --description "Watchlist match — apply now" 2>/dev/null || true
          { echo "cc @${{ github.repository_owner }}"; echo; cat "$URGENT_FILE"; } > /tmp/urgent-body.md
          gh issue create \
            --title "🚨 URGENT: ${{ steps.board.outputs.urgent_title }}" \
            --label urgent \
            --body-file /tmp/urgent-body.md
      - name: Big-tech alert
        if: steps.settings.outputs.run == 'true' && steps.board.outputs.bigtech_count != '' && steps.board.outputs.bigtech_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
        run: |
          [ -s "$BIGTECH_FILE" ] || exit 0
          gh label create big-tech --color 0E8A16 --description "New big-tech/unicorn intern or new-grad role" 2>/dev/null || true
          { echo "cc @${{ github.repository_owner }} — new big-tech/FAANG/unicorn early-career roles (quant/banking excluded)."; echo; cat "$BIGTECH_FILE"; } > /tmp/bigtech-body.md
          gh issue create \
            --title "⭐ Big tech: ${{ steps.board.outputs.bigtech_title }}" \
            --label big-tech \
            --body-file /tmp/bigtech-body.md
