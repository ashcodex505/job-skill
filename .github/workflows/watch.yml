# Hourly watchlist run: scrapes ONLY watchlisted supported companies plus the
# SimplifyJobs community feed (which covers unsupported portals like Google/
# Amazon), merges into the committed board without touching other companies,
# and raises an URGENT issue for new watchlist matches. Much lighter than the
# 12h full run in job-board.yml.
name: Watchlist

on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *" # hourly (best-effort; GitHub cron can lag)
  push:
    branches: [main]
    paths: ["career/watchlist.md"] # adding a watch in the app triggers an immediate run

permissions:
  contents: write
  issues: write
  actions: write # lets the guard disable this workflow while the watchlist is empty

concurrency:
  group: job-board # shares the group with the full run so they never race
  cancel-in-progress: false

jobs:
  # Cheap gate (~10s): with an empty watchlist there is nothing to alert on,
  # so the scan is skipped entirely. The 12h job-board run keeps the board
  # fresh either way.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_watches: ${{ steps.count.outputs.has_watches }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: career
      - id: count
        run: |
          n=$(sed -n '/^## Watches/,$p' career/watchlist.md 2>/dev/null | grep -c '^- ' || true)
          echo "Watches found: $n"
          echo "has_watches=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Empty watchlist → stop the hourly schedule entirely (no more runs in
      # the Actions list). The app re-enables + dispatches when a watch is
      # added; the 12h job-board run re-syncs as a backstop.
      - name: Disable self while watchlist is empty
        if: steps.count.outputs.has_watches == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable watch.yml -R ${{ github.repository }} && echo "watch.yml disabled — add a watch in the dashboard to resume"

  watch:
    needs: guard
    if: needs.guard.outputs.has_watches == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Watch scrape
        id: board
        run: npm run board -- --watch
        env:
          DATABASE_PATH: /tmp/scrape.db
          BOARD_NEW_JOBS_FILE: ${{ runner.temp }}/new-jobs.md
          BOARD_URGENT_FILE: ${{ runner.temp }}/urgent.md
      - name: Commit board updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOBS.md README.md board/jobs.json
          if git diff --cached --quiet; then
            echo "No board changes."
          else
            git commit -m "chore: watchlist scan (${{ steps.board.outputs.summary }}) [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Urgent watchlist alert
        if: steps.board.outputs.urgent_count != '' && steps.board.outputs.urgent_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          URGENT_FILE: ${{ runner.temp }}/urgent.md
        run: |
          [ -s "$URGENT_FILE" ] || exit 0
          gh label create urgent --color B60205 --description "Watchlist match — apply now" 2>/dev/null || true
          { echo "cc @${{ github.repository_owner }}"; echo; cat "$URGENT_FILE"; } > /tmp/urgent-body.md
          gh issue create \
            --title "🚨 URGENT: ${{ steps.board.outputs.urgent_title }}" \
            --label urgent \
            --body-file /tmp/urgent-body.md
