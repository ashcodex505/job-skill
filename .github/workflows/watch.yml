# Feed watcher: fires the community-feed scrape ONLY when one of the watched
# job repos (SimplifyJobs/New-Grad-Positions, SimplifyJobs/Summer2026-
# Internships, SimplifyJobs/Summer2027-Internships, speedyapply/2027-SWE-
# College-Jobs, vanshb03/Summer2027-Internships, vanshb03/New-Grad-2027)
# receives a new commit.
# GitHub cannot trigger cross-repo, so an hourly poll compares their HEAD
# SHAs against board/feed-heads.json and exits in seconds when nothing
# changed.
#
# Separately, the `priority` job checks companies from TWO lists — Amazon
# plus career/priority-companies.md (app-managed, the dashboard's Priority
# companies panel) plus every company on career/preferences.md's own
# "Summer 2027 approved companies" list that has a real adapter (~80 as of
# this writing) — every 30 minutes, direct API calls with no upstream repo
# to gate on. There is no push notification from any of these companies
# ("tell us when a job opens") — polling on a schedule is the only way to
# know, the same as every other source in this project. What IS gated: if
# BOTH lists are empty, this job doesn't run at all — no CI minutes spent,
# nothing — but in practice the approved-companies list alone almost always
# keeps it non-empty.
#
# career/preferences.md is edited by hand, not through a dashboard form —
# every local watch-scan tick (POST /api/scrape/watch, while the dashboard
# is open) checks it for uncommitted changes and pushes them automatically,
# which is also what gets a hand-edit here within one tick interval.
#
# Notifications are intentionally sparse either way: a ⭐ big-tech issue only
# when new big-tech/FAANG/unicorn intern or new-grad roles appear, posted
# within the last week (quant/banks excluded, stale postings excluded even
# if newly discovered — src/scraper/big-tech-alert.ts), plus the 🚨 urgent
# issue for personal watchlist matches. The committed alert ledger
# (board/alerted.json) guarantees no posting is ever notified twice. No
# per-run noise.
name: Feed watch

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *" # poll twice hourly; real work only on upstream commits
  push:
    branches: [main]
    paths: ["career/watchlist.md", "career/priority-companies.md", "career/preferences.md"]

permissions:
  contents: write
  issues: write

concurrency:
  group: job-board
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      heads: ${{ steps.check.outputs.heads }}
      has_priority: ${{ steps.priority.outputs.has_priority }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            board
            career
      - name: Check priority-companies + approved-companies lists
        id: priority
        run: |
          n1=$(sed -n '/^## Priority/,$p' career/priority-companies.md 2>/dev/null | grep -c '^- ' || true)
          n2=$(sed -n '/^## Summer 2027 approved companies/,/^## /p' career/preferences.md 2>/dev/null | grep -c '^- ' || true)
          echo "Priority companies: $n1, approved companies: $n2"
          echo "has_priority=$([ "$n1" -gt 0 ] || [ "$n2" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Compare upstream feed HEADs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPOS="SimplifyJobs/New-Grad-Positions SimplifyJobs/Summer2026-Internships SimplifyJobs/Summer2027-Internships speedyapply/2027-SWE-College-Jobs vanshb03/Summer2027-Internships vanshb03/New-Grad-2027"
          HEADS="{"
          for repo in $REPOS; do
            sha=$(gh api "repos/$repo/commits?per_page=1" --jq '.[0].sha' 2>/dev/null) || sha=""
            # A repo that doesn't exist yet (next season's) records a stable
            # placeholder instead of an error body.
            echo "$sha" | grep -qE '^[0-9a-f]{40}$' || sha="unavailable"
            HEADS="$HEADS\"$repo\":\"$sha\","
          done
          HEADS="${HEADS%,}}"
          echo "heads=$HEADS" >> "$GITHUB_OUTPUT"
          PREV=$(cat board/feed-heads.json 2>/dev/null || echo "{}")
          if [ "$HEADS" = "$PREV" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream commits since last check — skipping scrape."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changed (or manual/push run) — scraping."
          fi

  watch:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Watch scrape
        id: board
        run: npm run board -- --watch
        env:
          DATABASE_PATH: /tmp/scrape.db
          BOARD_URGENT_FILE: ${{ runner.temp }}/urgent.md
          BOARD_BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
          BOARD_ALERT_PAYLOAD_FILE: ${{ runner.temp }}/alerts.json
      - name: Record upstream feed HEADs
        run: printf '%s' '${{ needs.gate.outputs.heads }}' > board/feed-heads.json
      - name: Urgent watchlist alert
        if: steps.board.outputs.urgent_count != '' && steps.board.outputs.urgent_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          URGENT_FILE: ${{ runner.temp }}/urgent.md
          ALERT_PAYLOAD: ${{ runner.temp }}/alerts.json
          FINGERPRINT: ${{ steps.board.outputs.urgent_fingerprint }}
          NOTIFY_USER: ${{ vars.JOB_ALERT_GITHUB_USER || github.repository_owner }}
        run: |
          [ -s "$URGENT_FILE" ] || exit 0
          gh label create urgent --color B60205 --description "Watchlist match — apply now" 2>/dev/null || true
          issue=$(gh issue list --state all --limit 200 --json number,body --jq "[.[] | select(.body | contains(\"<!-- job-alert:$FINGERPRINT -->\"))][0].number // empty")
          if [ -z "$issue" ]; then
            { echo "cc @$NOTIFY_USER"; echo; cat "$URGENT_FILE"; } > /tmp/urgent-body.md
            url=$(gh issue create --title "🚨 URGENT: ${{ steps.board.outputs.urgent_title }}" --label urgent --assignee "$NOTIFY_USER" --body-file /tmp/urgent-body.md)
            gh issue view "$url" >/dev/null
          else
            gh issue view "$issue" >/dev/null
          fi
          npm run alert:ack -- --payload "$ALERT_PAYLOAD" --type urgent
      - name: Big-tech alert
        if: steps.board.outputs.bigtech_count != '' && steps.board.outputs.bigtech_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
          ALERT_PAYLOAD: ${{ runner.temp }}/alerts.json
          FINGERPRINT: ${{ steps.board.outputs.bigtech_fingerprint }}
          NOTIFY_USER: ${{ vars.JOB_ALERT_GITHUB_USER || github.repository_owner }}
        run: |
          [ -s "$BIGTECH_FILE" ] || exit 0
          gh label create big-tech --color 0E8A16 --description "New big-tech/unicorn intern or new-grad role" 2>/dev/null || true
          issue=$(gh issue list --state all --limit 200 --json number,body --jq "[.[] | select(.body | contains(\"<!-- job-alert:$FINGERPRINT -->\"))][0].number // empty")
          if [ -z "$issue" ]; then
            { echo "cc @$NOTIFY_USER — new big-tech/FAANG/unicorn early-career roles (quant/banking excluded)."; echo; cat "$BIGTECH_FILE"; } > /tmp/bigtech-body.md
            url=$(gh issue create --title "⭐ Big tech: ${{ steps.board.outputs.bigtech_title }}" --label big-tech --assignee "$NOTIFY_USER" --body-file /tmp/bigtech-body.md)
            gh issue view "$url" >/dev/null
          else
            gh issue view "$issue" >/dev/null
          fi
          npm run alert:ack -- --payload "$ALERT_PAYLOAD" --type bigtech
      - name: Commit board updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOBS.md README.md board/
          if git diff --cached --quiet; then
            echo "No board changes."
          else
            git commit -m "chore: feed watch (${{ steps.board.outputs.summary }}) [skip ci]"
            if ! git pull --rebase origin main; then
              echo "Push race detected — dropping this run's board commit; it self-corrects next run."
              git rebase --abort
            else
              git push
            fi
          fi

  # No upstream repo to compare a commit SHA against, so this just runs
  # every scheduled tick. Scoped to Amazon + career/priority-companies.md +
  # career/preferences.md's approved-companies list (see board-cli.ts
  # --priority) — direct API calls per company, not a full sweep —
  # sequenced after `watch` (not parallel) so the two jobs never race
  # pushing to board/.
  priority:
    needs: [gate, watch]
    if: always() && needs.gate.outputs.has_priority == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The preceding watch job may have pushed a board commit after this
          # workflow's event SHA was captured. Start from the latest main so
          # priority state (especially watch-health.json) is not dropped in a
          # guaranteed rebase conflict with that sibling job.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Priority company scrape
        id: board
        run: npm run board -- --priority --no-linkcheck
        env:
          DATABASE_PATH: /tmp/scrape.db
          BOARD_URGENT_FILE: ${{ runner.temp }}/urgent.md
          BOARD_BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
          BOARD_SOURCE_HEALTH_FILE: ${{ runner.temp }}/source-health.md
          BOARD_POLICY_GAP_FILE: ${{ runner.temp }}/policy-gap.md
          BOARD_RECOVERY_FILE: ${{ runner.temp }}/recovery.md
          BOARD_ALERT_PAYLOAD_FILE: ${{ runner.temp }}/alerts.json
      - name: Report scraper source health
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_FILE: ${{ runner.temp }}/source-health.md
          ERROR_COUNT: ${{ steps.board.outputs.source_error_count }}
          NOTIFY_USER: ${{ vars.JOB_ALERT_GITHUB_USER || github.repository_owner }}
        run: |
          gh label create scraper-health --color D93F0B --description "A configured job source could not be checked" 2>/dev/null || true
          issue=$(gh issue list --state open --label scraper-health --json number --jq '.[0].number // empty')
          if [ "${ERROR_COUNT:-0}" != "0" ]; then
            [ -s "$HEALTH_FILE" ] || exit 0
            { echo "cc @$NOTIFY_USER"; echo; cat "$HEALTH_FILE"; } > /tmp/source-health-body.md
            if [ -z "$issue" ]; then
              gh issue create --title "🛠 Job scraper source failure" --label scraper-health --assignee "$NOTIFY_USER" --body-file /tmp/source-health-body.md
            else
              gh issue edit "$issue" --body-file /tmp/source-health-body.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "All configured direct job sources recovered on this run."
          fi
      - name: Report strict-policy gaps
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_FILE: ${{ runner.temp }}/policy-gap.md
          GAP_COUNT: ${{ steps.board.outputs.policy_gap_count }}
          NOTIFY_USER: ${{ vars.JOB_ALERT_GITHUB_USER || github.repository_owner }}
        run: |
          gh label create policy-gap --color FBCA04 --description "A likely early-career title conflicts with strict preferences" 2>/dev/null || true
          issue=$(gh issue list --state open --label policy-gap --json number --jq '.[0].number // empty')
          if [ "${GAP_COUNT:-0}" != "0" ]; then
            [ -s "$POLICY_FILE" ] || exit 0
            { echo "cc @$NOTIFY_USER"; echo; cat "$POLICY_FILE"; } > /tmp/policy-gap-body.md
            if [ -z "$issue" ]; then
              gh issue create --title "⚠️ Job title policy needs review" --label policy-gap --assignee "$NOTIFY_USER" --body-file /tmp/policy-gap-body.md
            else
              gh issue edit "$issue" --body-file /tmp/policy-gap-body.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "No strict new-grad title-policy gaps were found on this run."
          fi
      - name: Record watcher recovery in run summary
        if: steps.board.outputs.recovery_gap_minutes != '' && steps.board.outputs.recovery_gap_minutes != '0'
        env:
          RECOVERY_FILE: ${{ runner.temp }}/recovery.md
        run: |
          [ -s "$RECOVERY_FILE" ] || exit 0
          { echo "## Watcher recovery"; echo; cat "$RECOVERY_FILE"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Urgent watchlist alert
        if: steps.board.outputs.urgent_count != '' && steps.board.outputs.urgent_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          URGENT_FILE: ${{ runner.temp }}/urgent.md
          ALERT_PAYLOAD: ${{ runner.temp }}/alerts.json
          FINGERPRINT: ${{ steps.board.outputs.urgent_fingerprint }}
          NOTIFY_USER: ${{ vars.JOB_ALERT_GITHUB_USER || github.repository_owner }}
        run: |
          [ -s "$URGENT_FILE" ] || exit 0
          gh label create urgent --color B60205 --description "Watchlist match — apply now" 2>/dev/null || true
          issue=$(gh issue list --state all --limit 200 --json number,body --jq "[.[] | select(.body | contains(\"<!-- job-alert:$FINGERPRINT -->\"))][0].number // empty")
          if [ -z "$issue" ]; then
            { echo "cc @$NOTIFY_USER"; echo; cat "$URGENT_FILE"; } > /tmp/urgent-body.md
            url=$(gh issue create --title "🚨 URGENT: ${{ steps.board.outputs.urgent_title }}" --label urgent --assignee "$NOTIFY_USER" --body-file /tmp/urgent-body.md)
            gh issue view "$url" >/dev/null
          else
            gh issue view "$issue" >/dev/null
          fi
          npm run alert:ack -- --payload "$ALERT_PAYLOAD" --type urgent
      - name: Big-tech alert
        if: steps.board.outputs.bigtech_count != '' && steps.board.outputs.bigtech_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
          ALERT_PAYLOAD: ${{ runner.temp }}/alerts.json
          FINGERPRINT: ${{ steps.board.outputs.bigtech_fingerprint }}
          NOTIFY_USER: ${{ vars.JOB_ALERT_GITHUB_USER || github.repository_owner }}
        run: |
          [ -s "$BIGTECH_FILE" ] || exit 0
          gh label create big-tech --color 0E8A16 --description "New big-tech/unicorn intern or new-grad role" 2>/dev/null || true
          issue=$(gh issue list --state all --limit 200 --json number,body --jq "[.[] | select(.body | contains(\"<!-- job-alert:$FINGERPRINT -->\"))][0].number // empty")
          if [ -z "$issue" ]; then
            { echo "cc @$NOTIFY_USER — new big-tech/FAANG/unicorn early-career roles (quant/banking excluded)."; echo; cat "$BIGTECH_FILE"; } > /tmp/bigtech-body.md
            url=$(gh issue create --title "⭐ Big tech: ${{ steps.board.outputs.bigtech_title }}" --label big-tech --assignee "$NOTIFY_USER" --body-file /tmp/bigtech-body.md)
            gh issue view "$url" >/dev/null
          else
            gh issue view "$issue" >/dev/null
          fi
          npm run alert:ack -- --payload "$ALERT_PAYLOAD" --type bigtech
      - name: Commit board updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOBS.md README.md board/
          if git diff --cached --quiet; then
            echo "No board changes."
          else
            git commit -m "chore: priority scan (${{ steps.board.outputs.summary }}) [skip ci]"
            if ! git pull --rebase origin main; then
              echo "Push race detected — dropping this run's board commit; it self-corrects next run."
              git rebase --abort
            else
              git push
            fi
          fi
