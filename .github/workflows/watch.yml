# Feed watcher: fires the scrape ONLY when one of the watched job repos
# (SimplifyJobs/New-Grad-Positions, SimplifyJobs/Summer2027-Internships,
# speedyapply/2027-SWE-College-Jobs) receives a new commit. GitHub cannot
# trigger cross-repo, so an hourly poll compares their HEAD SHAs against
# board/feed-heads.json and exits in seconds when nothing changed.
#
# Notifications are intentionally sparse: a ⭐ big-tech issue only when new
# big-tech/FAANG/unicorn intern or new-grad roles appear (quant/banks
# excluded — src/scraper/big-tech-alert.ts), plus the 🚨 urgent issue for
# personal watchlist matches. No per-run noise.
name: Feed watch

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *" # poll twice hourly; real work only on upstream commits
  push:
    branches: [main]
    paths: ["career/watchlist.md"]

permissions:
  contents: write
  issues: write

concurrency:
  group: job-board
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      heads: ${{ steps.check.outputs.heads }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: board
      - name: Compare upstream feed HEADs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPOS="SimplifyJobs/New-Grad-Positions SimplifyJobs/Summer2027-Internships speedyapply/2027-SWE-College-Jobs"
          HEADS="{"
          for repo in $REPOS; do
            sha=$(gh api "repos/$repo/commits?per_page=1" --jq '.[0].sha' 2>/dev/null || echo "unavailable")
            HEADS="$HEADS\"$repo\":\"$sha\","
          done
          HEADS="${HEADS%,}}"
          echo "heads=$HEADS" >> "$GITHUB_OUTPUT"
          PREV=$(cat board/feed-heads.json 2>/dev/null || echo "{}")
          if [ "$HEADS" = "$PREV" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream commits since last check — skipping scrape."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changed (or manual/push run) — scraping."
          fi

  watch:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Watch scrape
        id: board
        run: npm run board -- --watch
        env:
          DATABASE_PATH: /tmp/scrape.db
          BOARD_URGENT_FILE: ${{ runner.temp }}/urgent.md
          BOARD_BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
      - name: Record upstream feed HEADs
        run: printf '%s' '${{ needs.gate.outputs.heads }}' > board/feed-heads.json
      - name: Commit board updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOBS.md README.md board/jobs.json board/feed-heads.json
          if git diff --cached --quiet; then
            echo "No board changes."
          else
            git commit \
              -m "chore: feed watch (${{ steps.board.outputs.summary }}) [skip ci]" \
              -m "Co-authored-by: Ashish Kurse <ashishkurse@gmail.com>"
            git pull --rebase origin main
            git push
          fi
      - name: Urgent watchlist alert
        if: steps.board.outputs.urgent_count != '' && steps.board.outputs.urgent_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          URGENT_FILE: ${{ runner.temp }}/urgent.md
        run: |
          [ -s "$URGENT_FILE" ] || exit 0
          gh label create urgent --color B60205 --description "Watchlist match — apply now" 2>/dev/null || true
          { echo "cc @${{ github.repository_owner }}"; echo; cat "$URGENT_FILE"; } > /tmp/urgent-body.md
          gh issue create \
            --title "🚨 URGENT: ${{ steps.board.outputs.urgent_title }}" \
            --label urgent \
            --body-file /tmp/urgent-body.md
      - name: Big-tech alert
        if: steps.board.outputs.bigtech_count != '' && steps.board.outputs.bigtech_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BIGTECH_FILE: ${{ runner.temp }}/bigtech.md
        run: |
          [ -s "$BIGTECH_FILE" ] || exit 0
          gh label create big-tech --color 0E8A16 --description "New big-tech/unicorn intern or new-grad role" 2>/dev/null || true
          { echo "cc @${{ github.repository_owner }} — new big-tech/FAANG/unicorn early-career roles (quant/banking excluded)."; echo; cat "$BIGTECH_FILE"; } > /tmp/bigtech-body.md
          gh issue create \
            --title "⭐ Big tech: ${{ steps.board.outputs.bigtech_title }}" \
            --label big-tech \
            --body-file /tmp/bigtech-body.md
